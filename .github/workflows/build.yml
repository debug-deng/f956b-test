name: build F956B exploit payload

on:
  push:
    branches: [main]
    paths:
      - 'work/target.h'
      - 'work/p0_fingerprint.h'
      - 'work/vmlinux.elf'
      - 'work/vmlinux.btf'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: checkout F956B adaptation
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: install Android NDK r29 (Linux)
        run: |
          set -euo pipefail
          NDK_FILE_VER=r29
          cd /tmp
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_FILE_VER}-linux.zip" \
               -O ndk.zip
          echo "87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b  ndk.zip" | sha1sum -c -
          unzip -q ndk.zip
          sudo mv "android-ndk-${NDK_FILE_VER}" /opt/ndk
          echo "/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version | head -1

      - name: clone upstream Root-My-Galaxy-Payloads
        run: |
          set -euo pipefail
          cd /tmp
          git clone --depth 1 https://github.com/BuSung-dev/Root-My-Galaxy-Payloads.git payloads

      - name: overlay F956B target.h and p0_fingerprint.h
        run: |
          set -euo pipefail
          mkdir -p /tmp/payloads/src/targets/q6q-F956BXXS4DZG3
          cp work/target.h         /tmp/payloads/src/targets/q6q-F956BXXS4DZG3/
          cp work/p0_fingerprint.h /tmp/payloads/src/targets/q6q-F956BXXS4DZG3/
          grep -cE '^#define \w+_OFF' /tmp/payloads/src/targets/q6q-F956BXXS4DZG3/target.h

      - name: build cve-2026-43499-app.so (release)
        run: |
          set -euo pipefail
          cd /tmp/payloads
          export ANDROID_NDK_HOME=/opt/ndk
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make TARGET=q6q-F956BXXS4DZG3 release 2>&1 | tail -60

      - name: build cve-2026-43499 (preload) + root helper
        run: |
          set -euo pipefail
          cd /tmp/payloads
          export ANDROID_NDK_HOME=/opt/ndk
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make TARGET=q6q-F956BXXS4DZG3 2>&1 | tail -60

      - name: verify output sizes
        run: |
          set -euo pipefail
          APP_REL=/tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499-app.release.so
          ls -la /tmp/payloads/build/q6q-F956BXXS4DZG3/
          SIZE=$(stat -c %s "$APP_REL")
          echo "release.so size: $SIZE (limit 104128)"

      - name: download Samsung F956B kernel source
        run: |
          set -euo pipefail
          # NOTE: We don't actually need Kernel.tar.gz/Platform.tar.gz because the
          # ghcr.io/ylarod/ddk-min:android14-6.1-20260313 image bundles a
          # matching kernel source tree at /opt/ddk/kdir/android14-6.1 with
          # vmlinux already built. The fallback to download from a release
          # is preserved for reproducibility (see KERNEL_SOURCE_NOTE.md).
          if [ -f "$GITHUB_WORKSPACE/work/SM-F956B_16_Opensource/Kernel.tar.gz" ]; then
            echo "::notice::Local Kernel.tar.gz present but not used; DDK image KDIR is preferred."
          fi
          echo "skipping kernel source download (using DDK image's /opt/ddk/kdir/android14-6.1)"

      - name: build kernelsu.ko + ksud via DDK + samsung-main
        run: |
          set -euo pipefail
          # samsung-main is tiann/KernelSU's branch with BuSung-dev's
          # Samsung KDP/RKP/DEFEX patch already applied. No separate
          # `git apply` needed.
          cd /tmp
          git clone --depth 1 -b samsung-main https://github.com/tiann/KernelSU.git 2>&1 | tail -3
          cd KernelSU
          git log -1 --oneline
          ls kernel/ | head -5

          # Build inside DDK container. The DDK image bundles a kernel source
          # tree at /opt/ddk/kdir/android14-6.1/. We override the vermagic
          # to 6.1.145-android14-11 to match the F956B target.
          #
          # We mount:
          #   - /tmp/KernelSU/kernel -> /opt/ddk/kdir/android14-6.1/drivers/kernelsu/
          #     (the directory setup.sh would normally symlink; we do it directly)
          docker run --rm \
            -v "/tmp/KernelSU/kernel:/opt/ddk/src/android14-6.1/drivers/kernelsu:rw" \
            -w /opt/ddk/kdir/android14-6.1 \
            -e KDIR=/opt/ddk/kdir/android14-6.1 \
            -e ARCH=arm64 \
            -e CROSS_COMPILE=aarch64-linux-gnu- \
            -e LLVM=1 \
            -e LLVM_IAS=1 \
            ghcr.io/ylarod/ddk-min:android14-6.1-20260313 \
            bash -c '
              set -euo pipefail
              export KDIR=${KDIR:-/opt/ddk/kdir/android14-6.1}
              export ARCH=${ARCH:-arm64}
              export CROSS_COMPILE=${CROSS_COMPILE:-aarch64-linux-gnu-}
              export LLVM=${LLVM:-1}
              export LLVM_IAS=${LLVM_IAS:-1}
              echo "== DDK env =="
              uname -a
              clang --version | head -1
              echo "KDIR=$KDIR"
              echo "== verify mount and KDIR layout =="
              ls "$KDIR/.config" && echo "  .config present"
              # The kdir/ tree uses src/ as its source. mount went to src/.
              ls "/opt/ddk/src/android14-6.1/drivers/kernelsu/" | head -10
              echo "== patch drivers/Makefile + drivers/Kconfig =="
              # KernelSU's setup.sh does two extra steps besides the symlink:
              # it appends 'obj-$(CONFIG_KSU) += kernelsu/' to drivers/Makefile
              # and 'source "drivers/kernelsu/Kconfig"' to drivers/Kconfig.
              # Without these, make modules does not even know the module exists.
              # Use a single-line echo (printf with multi-line escapes has caused
              # issues when the script is parsed through YAML+bash -c).
              if ! grep -q 'obj-$(CONFIG_KSU)' "$KDIR/drivers/Makefile"; then
                echo "" >> "$KDIR/drivers/Makefile"
                echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "$KDIR/drivers/Makefile"
                echo "  appended to drivers/Makefile"
              fi
              if ! grep -q 'drivers/kernelsu/Kconfig' "$KDIR/drivers/Kconfig"; then
                sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$KDIR/drivers/Kconfig"
                echo "  appended to drivers/Kconfig"
              fi
              echo "== check .config for KSU =="
              grep -E "^CONFIG_(KSU|KPROBES|EXT4_FS|MODULES|ARM64)=" "$KDIR/.config" | head -10
              echo "== ensure CONFIG_KSU=m + dependencies in .config =="
              # KernelSU Kconfig says: depends on KPROBES && EXT4_FS, default y
              # We need to force CONFIG_KSU=m so 'make modules' builds it
              # as a loadable .ko rather than a builtin.
              for cfg in \
                "CONFIG_KSU=m" \
                "CONFIG_KPROBES=y" \
                "CONFIG_KPROBE_EVENTS=y" \
                "CONFIG_EXT4_FS=y" \
                "CONFIG_EXT4_FS_POSIX_ACL=y" \
                "CONFIG_EXT4_FS_SECURITY=y" \
                "CONFIG_SECURITY=y" \
                "CONFIG_MODULES=y" \
                "CONFIG_MODULE_UNLOAD=y" \
                "CONFIG_KSU_SAMSUNG_KDP=y" \
                "CONFIG_KSU_SAMSUNG_RKP=y" \
                "CONFIG_KSU_SAMSUNG_DEFEX=y"; do
                key="${cfg%%=*}"
                cur="$(grep -E "^${key}=" "$KDIR/.config" || echo "${key}=n")"
                if [ "$cur" != "$cfg" ]; then
                  sed -i "s/^${key}=.*/${cfg}/" "$KDIR/.config"
                  echo "  $cur -> $cfg"
                fi
              done
              echo "== post-update grep =="
              grep -E "^CONFIG_(KSU|KPROBES|EXT4_FS|MODULES|KSU_SAMSUNG)=" "$KDIR/.config"
              # Re-run olddefconfig to make sure the .config is consistent
              make olddefconfig 2>&1 | tail -5
              echo "== modules_prepare =="
              cd "$KDIR"
              make modules_prepare 2>&1 | tail -10
              echo "== verify auto.conf has CONFIG_KSU after modules_prepare =="
              grep -E "^CONFIG_KSU" include/config/auto.conf 2>&1 || echo "  auto.conf missing CONFIG_KSU"
              grep -E "^CONFIG_(KSU_SAMSUNG|KPROBES)" include/config/auto.conf 2>&1 | head -3
              echo "== override vermagic to 6.1.145-android14-11 =="
              sed -i "s/6.1.166-dirty/6.1.145-android14-11/g" \
                  "$KDIR/include/config/kernel.release" 2>/dev/null || true
              sed -i "s/6.1.166/6.1.145-android14-11/g" \
                  "$KDIR/include/config/kernel.release" 2>/dev/null || true
              printf "%s\n" \
                "#define UTS_RELEASE \"6.1.145-android14-11\"" \
                "#define VERMAGIC_STRING \"6.1.145-android14-11 SMP preempt mod_unload modversions aarch64\"" \
                > "$KDIR/include/generated/utsrelease.h"
              cat "$KDIR/include/config/kernel.release"
              echo "== build kernelsu.ko in-tree via M=drivers/kernelsu =="
              make M=drivers/kernelsu modules -j"$(nproc)" 2>&1
              echo "== EXPLICIT LIST OF BUILD ARTIFACTS =="
              find drivers/kernelsu/ -maxdepth 2 -type f -ls 2>&1 | head -30

              echo "== verify kernelsu.ko =="
              ls -la drivers/kernelsu/kernelsu.ko 2>&1
              modinfo drivers/kernelsu/kernelsu.ko 2>&1 | grep -E "vermagic|depends|srcversion"
            '

      - name: strip and copy kernelsu.ko
        run: |
          set -euo pipefail
          mkdir -p artifacts-kernel
          # The kernelsu.ko ends up at /opt/ddk/src/android14-6.1/drivers/kernelsu/kernelsu.ko
          # (where the bind mount put our patched source). Try the expected
          # absolute paths first; fall back to any kernelsu.ko findable
          # under /tmp (in case the build wrote it elsewhere).
          KO=""
          for cand in \
            /opt/ddk/src/android14-6.1/drivers/kernelsu/kernelsu.ko \
            /opt/ddk/kdir/android14-6.1/drivers/kernelsu/kernelsu.ko \
            /tmp/KernelSU/kernel/kernelsu.ko \
            /tmp/KernelSU/drivers/kernelsu/kernelsu.ko; do
            if [ -f "$cand" ]; then
              KO="$cand"
              break
            fi
          done
          if [ -z "$KO" ]; then
            echo "ERROR: kernelsu.ko not found in any expected location"
            echo "Searching /opt/ddk and /tmp for kernelsu.ko:"
            find /opt/ddk /tmp -name "kernelsu.ko" 2>/dev/null
            exit 1
          fi
          echo "Found kernelsu.ko at $KO"
          /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip -d "$KO"
          cp "$KO" artifacts-kernel/android14-6.1_kernelsu-q6q-F956BXXS4DZG3-kdp.ko
          ls -la artifacts-kernel/

      - name: build ksud userspace (Rust)
        run: |
          set -euo pipefail
          cd /tmp/KernelSU
          # kernelsu.ko must be at userspace/ksud/bin/aarch64/android14-6.1_kernelsu.ko
          # so ksud can embed it.
          mkdir -p userspace/ksud/bin/aarch64
          if [ -f /tmp/KernelSU/drivers/kernelsu/kernelsu.ko ]; then
            cp /tmp/KernelSU/drivers/kernelsu/kernelsu.ko userspace/ksud/bin/aarch64/android14-6.1_kernelsu.ko
          else
            cp /tmp/KernelSU/kernel/kernelsu.ko userspace/ksud/bin/aarch64/android14-6.1_kernelsu.ko
          fi
          ls -la userspace/ksud/bin/aarch64/
          # Configure Rust for aarch64-linux-android
          NDK_BIN="/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$HOME/.cargo/bin:$NDK_BIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android35-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo build --release --target aarch64-linux-android -p ksud 2>&1 | tail -20

      - name: copy ksud binary
        run: |
          set -euo pipefail
          if [ -f /tmp/KernelSU/target/aarch64-linux-android/release/ksud ]; then
            cp /tmp/KernelSU/target/aarch64-linux-android/release/ksud \
               artifacts-kernel/ksud-q6q-F956BXXS4DZG3-kdp
            chmod +x artifacts-kernel/ksud-q6q-F956BXXS4DZG3-kdp
            ls -la artifacts-kernel/
          else
            echo "WARNING: ksud not built"
            exit 1
          fi

      - name: collect artifacts + SHA-256
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp /tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499-app.release.so artifacts/cve-2026-43499-app.so
          cp /tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499-app.so        artifacts/cve-2026-43499-app.debug.so
          cp /tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499             artifacts/cve-2026-43499
          cp /tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499-root        artifacts/cve-2026-43499-root
          # Include kernelsu.ko + ksud if they exist (KSU build is optional)
          if [ -f artifacts-kernel/android14-6.1_kernelsu-q6q-F956BXXS4DZG3-kdp.ko ]; then
            cp artifacts-kernel/* artifacts/
          fi
          cd artifacts
          sha256sum * > SHA256SUMS
          echo "" >> SHA256SUMS
          echo "## source artifacts" >> SHA256SUMS
          (cd .. && sha256sum work/target.h work/p0_fingerprint.h) >> SHA256SUMS
          cat SHA256SUMS

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f956b-exploit-payloads
          path: artifacts/
          if-no-files-found: error

      - name: build summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo
            echo "| file | size (bytes) | sha256 |"
            echo "|---|---|---|"
            for f in artifacts/*; do
              [ -f "$f" ] || continue
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              sz=$(stat -c %s "$f")
              echo "| $(basename $f) | $sz | \`$sha\` |"
            done
            echo
            echo "**WARNING**: \`p0_fingerprint.h\` has 31 placeholder entries duplicated from slide=0."
            echo "Only the slide=0 entry contains real kernel-image data."
            echo
            echo "**KernelSU module and ksud are NOT built in this workflow.**"
            echo "See \`upstream-integration/SM-F956B-F956BXXS4DZG3.md\` Stage 7 for the"
            echo "Docker-based DDK build procedure, which requires manual setup."
          } >> "$GITHUB_STEP_SUMMARY"