name: build F956B exploit payload

on:
  push:
    branches: [main]
    paths:
      - 'work/target.h'
      - 'work/p0_fingerprint.h'
      - 'work/vmlinux.elf'
      - 'work/vmlinux.btf'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: checkout F956B adaptation
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: install Android NDK r29 (Linux)
        run: |
          set -euo pipefail
          NDK_FILE_VER=r29
          cd /tmp
          wget -q "https://dl.google.com/android/repository/android-ndk-${NDK_FILE_VER}-linux.zip" -O ndk.zip
          echo "87e2bb7e9be5d6a1c6cdf5ec40dd4e0c6d07c30b  ndk.zip" | sha1sum -c -
          unzip -q ndk.zip
          sudo mv "android-ndk-${NDK_FILE_VER}" /opt/ndk
          echo "/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version | head -1

      - name: clone upstream Root-My-Galaxy-Payloads
        run: |
          set -euo pipefail
          cd /tmp
          git clone --depth 1 https://github.com/BuSung-dev/Root-My-Galaxy-Payloads.git payloads

      - name: overlay F956B target.h and p0_fingerprint.h
        run: |
          set -euo pipefail
          mkdir -p /tmp/payloads/src/targets/q6q-F956BXXS4DZG3
          cp work/target.h         /tmp/payloads/src/targets/q6q-F956BXXS4DZG3/
          cp work/p0_fingerprint.h /tmp/payloads/src/targets/q6q-F956BXXS4DZG3/
          grep -cE '^#define \w+_OFF' /tmp/payloads/src/targets/q6q-F956BXXS4DZG3/target.h

      - name: build cve-2026-43499-app.so (release)
        run: |
          set -euo pipefail
          cd /tmp/payloads
          export ANDROID_NDK_HOME=/opt/ndk
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make TARGET=q6q-F956BXXS4DZG3 release 2>&1 | tail -60

      - name: build cve-2026-43499 (preload) + root helper
        run: |
          set -euo pipefail
          cd /tmp/payloads
          export ANDROID_NDK_HOME=/opt/ndk
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          make TARGET=q6q-F956BXXS4DZG3 2>&1 | tail -60

      - name: verify output sizes
        run: |
          set -euo pipefail
          APP_REL=/tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499-app.release.so
          ls -la /tmp/payloads/build/q6q-F956BXXS4DZG3/
          SIZE=$(stat -c %s "$APP_REL")
          echo "release.so size: $SIZE (limit 104128)"

      - name: download Samsung F956B kernel source from release v1
        run: |
          set -euo pipefail
          # The build needs the Samsung open-source kernel archive (Kernel.tar.gz)
          # that matches F956BXXS4DZG3. We cannot commit 640MB to git, so
          # publish it as a release asset on debug-deng/f956b-test and pull
          # it here. See KERNEL_SOURCE_NOTE.md for how the release is set up.
          KERNEL_RELEASE_TAG="${KERNEL_RELEASE_TAG:-v1}"
          BASE="https://github.com/debug-deng/f956b-test/releases/download/${KERNEL_RELEASE_TAG}"
          mkdir -p /tmp/samsung-kernel
          cd /tmp/samsung-kernel
          for f in Kernel.tar.gz Platform.tar.gz; do
            echo "downloading ${BASE}/$f"
            if ! wget -q --tries=3 "${BASE}/$f" -O "$f"; then
              echo "::error::Could not download $f from release ${KERNEL_RELEASE_TAG}."
              echo "Upload Kernel.tar.gz + Platform.tar.gz to debug-deng/f956b-test release ${KERNEL_RELEASE_TAG},"
              echo "then re-run this workflow."
              exit 1
            fi
            echo "  $f: $(stat -c %s $f) bytes"
          done
          tar -xzf Kernel.tar.gz
          tar -xzf Platform.tar.gz
          echo "extracted layout:"
          ls /tmp/samsung-kernel/kernel_platform/msm-kernel/ | head -5
          test -f /tmp/samsung-kernel/kernel_platform/msm-kernel/Makefile || {
            echo "ERROR: Kernel.tar.gz extract did not produce msm-kernel/Makefile"
            exit 1
          }
          grep -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" /tmp/samsung-kernel/kernel_platform/msm-kernel/Makefile | head -3

      - name: build kernelsu.ko + ksud via DDK + samsung-main
        run: |
          set -euo pipefail
          cd /tmp
          git clone --depth 1 -b samsung-main https://github.com/tiann/KernelSU.git 2>&1 | tail -3
          cd KernelSU
          git log -1 --oneline
          ls kernel/ | head -5

          # Write the full DDK build script to a file, then run it inside
          # the container with output captured to /tmp/ddk_build_full.log.
          # This avoids shell-quoting hell with multi-line bash -c.
          cat > /tmp/ddk_build.sh <<'DDKBUILD'
            #!/bin/bash
            set -euo pipefail
            export KDIR=/kernel_src
            export ARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            export LLVM=1
            export LLVM_IAS=1
            cd "$KDIR"
            echo "== DDK env =="
            uname -a
            clang --version | head -1
            echo "KDIR=$KDIR"
            echo "== source layout =="
            ls "$KDIR/drivers/kernelsu/" 2>&1 | head -5
            grep -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" "$KDIR/Makefile" | head -3

            # Patch drivers/Makefile + drivers/Kconfig (KernelSU setup.sh does this)
            if ! grep -q 'obj-$(CONFIG_KSU)' "$KDIR/drivers/Makefile"; then
              echo "" >> "$KDIR/drivers/Makefile"
              echo 'obj-$(CONFIG_KSU) += kernelsu/' >> "$KDIR/drivers/Makefile"
              echo "  patched drivers/Makefile"
            fi
            if ! grep -q "drivers/kernelsu/Kconfig" "$KDIR/drivers/Kconfig"; then
              sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' "$KDIR/drivers/Kconfig"
              echo "  patched drivers/Kconfig"
            fi

            if [ ! -f "$KDIR/.config" ]; then
              cp "$KDIR/arch/arm64/configs/gki_defconfig" "$KDIR/.config"
              echo "  copied gki_defconfig"
            fi

            for cfg in \
              "CONFIG_KSU=y" \
              "CONFIG_KPROBES=y" \
              "CONFIG_KPROBE_EVENTS=y" \
              "CONFIG_EXT4_FS=y" \
              "CONFIG_EXT4_FS_POSIX_ACL=y" \
              "CONFIG_EXT4_FS_SECURITY=y" \
              "CONFIG_SECURITY=y" \
              "CONFIG_MODULES=y" \
              "CONFIG_MODULE_UNLOAD=y" \
              "CONFIG_KSU_SAMSUNG_KDP=y" \
              "CONFIG_KSU_SAMSUNG_RKP=y" \
              "CONFIG_KSU_SAMSUNG_DEFEX=y"; do
              key="${cfg%%=*}"
              cur="$(grep -E "^${key}=" "$KDIR/.config" 2>/dev/null || echo "${key}=n")"
              if [ "$cur" != "$cfg" ]; then
                sed -i "s/^${key}=.*/${cfg}/" "$KDIR/.config"
              fi
            done

            cd "$KDIR"
            make olddefconfig > /tmp/m1.log 2>&1; echo "olddefconfig rc=$?"
            make prepare > /tmp/m2.log 2>&1; echo "prepare rc=$?"
            grep -E "^CONFIG_KSU\b" include/config/auto.conf && echo "  auto.conf has KSU" || echo "WARN: auto.conf missing CONFIG_KSU"
            make modules_prepare > /tmp/m3.log 2>&1; echo "modules_prepare rc=$?"

            cd "$KDIR"
            make M=drivers/kernelsu modules -j"$(nproc)" > /tmp/m4.log 2>&1; echo "build rc=$?"
            echo "tail of make log:"
            tail -60 /tmp/m4.log
            echo "errors:"
            grep -iE "error:|undefined" /tmp/m4.log | head -10 || echo "  none"
            echo "warnings:"
            grep -iE "warning:" /tmp/m4.log | head -10 || echo "  none"

            echo "== build artifacts =="
            find drivers/kernelsu/ -maxdepth 2 -name "*.o" -o -name "*.ko" 2>&1 | head -20
            ls -la drivers/kernelsu/kernelsu.ko 2>&1 || echo "ERROR: kernelsu.ko not built"
            if [ -f drivers/kernelsu/kernelsu.ko ]; then
              modinfo drivers/kernelsu/kernelsu.ko 2>&1 | grep -E "vermagic|depends" || true
            fi
DDKBUILD
          chmod +x /tmp/ddk_build.sh

          docker run --rm \
            -v "/tmp/samsung-kernel/kernel_platform/msm-kernel:/kernel_src:rw" \
            -v "/tmp/KernelSU/kernel:/kernel_src/drivers/kernelsu:rw" \
            -v /tmp/ddk_build.sh:/tmp/ddk_build.sh:ro \
            -w /kernel_src \
            -e KDIR=/kernel_src \
            -e ARCH=arm64 \
            -e CROSS_COMPILE=aarch64-linux-gnu- \
            -e LLVM=1 \
            -e LLVM_IAS=1 \
            ghcr.io/ylarod/ddk-min:android14-6.1-20260313 \
            bash /tmp/ddk_build.sh 2>&1 | tee /tmp/ddk_build_full.log | tail -80
          echo "=== full log line count ==="
          wc -l /tmp/ddk_build_full.log
          echo "=== errors in full log ==="
          grep -iE "error|undefined" /tmp/ddk_build_full.log | head -10 || echo "  no errors"

      - name: strip and copy kernelsu.ko
        run: |
          set -euo pipefail
          mkdir -p artifacts-kernel
          docker run --rm \
            -v "/tmp/samsung-kernel/kernel_platform/msm-kernel:/kernel_src:rw" \
            -v "/tmp/KernelSU/kernel:/kernel_src/drivers/kernelsu:rw" \
            -v "$PWD/artifacts-kernel:/out:rw" \
            ghcr.io/ylarod/ddk-min:android14-6.1-20260313 \
            bash -c '
              set -euo pipefail
              KO=/kernel_src/drivers/kernelsu/kernelsu.ko
              if [ ! -f "$KO" ]; then
                echo "ERROR: kernelsu.ko not found at $KO"
                find /kernel_src/drivers/kernelsu -name "*.ko" 2>/dev/null
                exit 1
              fi
              /opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip -d "$KO" 2>/dev/null || \
                echo "  warning: no llvm-strip available, leaving symbols in"
              cp "$KO" /out/android14-6.1_kernelsu-q6q-F956BXXS4DZG3-kdp.ko
              ls -la /out/
            '
          ls -la artifacts-kernel/

      - name: build ksud userspace (Rust)
        run: |
          set -euo pipefail
          cd /tmp/KernelSU
          docker run --rm \
            -v "/tmp/samsung-kernel/kernel_platform/msm-kernel:/kernel_src:rw" \
            -v "/tmp/KernelSU/kernel:/kernel_src/drivers/kernelsu:rw" \
            -v "$PWD:/work:rw" \
            ghcr.io/ylarod/ddk-min:android14-6.1-20260313 \
            bash -c '
              set -euo pipefail
              if [ -f /kernel_src/drivers/kernelsu/kernelsu.ko ]; then
                cp /kernel_src/drivers/kernelsu/kernelsu.ko /work/kernelsu.ko
                echo "copied kernelsu.ko"
              else
                echo "ERROR: kernelsu.ko missing in container"
                find /kernel_src -name "kernelsu.ko" 2>/dev/null
                exit 1
              fi
            '
          mkdir -p userspace/ksud/bin/aarch64
          cp kernelsu.ko userspace/ksud/bin/aarch64/android14-6.1_kernelsu.ko
          ls -la userspace/ksud/bin/aarch64/
          NDK_BIN="/opt/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export PATH="$HOME/.cargo/bin:$NDK_BIN:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android35-clang"
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo build --release --target aarch64-linux-android -p ksud 2>&1 | tail -20

      - name: copy ksud binary
        run: |
          set -euo pipefail
          if [ -f /tmp/KernelSU/target/aarch64-linux-android/release/ksud ]; then
            cp /tmp/KernelSU/target/aarch64-linux-android/release/ksud \
               artifacts-kernel/ksud-q6q-F956BXXS4DZG3-kdp
            chmod +x artifacts-kernel/ksud-q6q-F956BXXS4DZG3-kdp
            ls -la artifacts-kernel/
          else
            echo "ERROR: ksud not built"
            exit 1
          fi

      - name: collect artifacts + SHA-256
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp /tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499-app.release.so artifacts/cve-2026-43499-app.so
          cp /tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499-app.so        artifacts/cve-2026-43499-app.debug.so
          cp /tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499             artifacts/cve-2026-43499
          cp /tmp/payloads/build/q6q-F956BXXS4DZG3/cve-2026-43499-root        artifacts/cve-2026-43499-root
          if [ -f artifacts-kernel/android14-6.1_kernelsu-q6q-F956BXXS4DZG3-kdp.ko ]; then
            cp artifacts-kernel/* artifacts/
          fi
          cd artifacts
          sha256sum * > SHA256SUMS
          echo "" >> SHA256SUMS
          echo "## source artifacts" >> SHA256SUMS
          (cd .. && sha256sum work/target.h work/p0_fingerprint.h) >> SHA256SUMS
          cat SHA256SUMS

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: f956b-exploit-payloads
          path: artifacts/
          if-no-files-found: error

      - name: build summary
        if: always()
        run: |
          {
            echo "## Build summary"
            echo
            echo "| file | size (bytes) | sha256 |"
            echo "|---|---|---|"
            for f in artifacts/*; do
              [ -f "$f" ] || continue
              sha=$(sha256sum "$f" | cut -d' ' -f1)
              sz=$(stat -c %s "$f")
              echo "| $(basename $f) | $sz | \`$sha\` |"
            done
            echo
            echo "**WARNING**: \`p0_fingerprint.h\` has 31 placeholder entries duplicated from slide=0."
            echo "Only the slide=0 entry contains real kernel-image data."
          } >> "$GITHUB_STEP_SUMMARY"